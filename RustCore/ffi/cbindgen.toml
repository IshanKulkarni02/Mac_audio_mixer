language = "C"
header = "// Generated by cbindgen from RustCore/ffi. Do not edit by hand."
include_guard = "MIXER_FFI_H"

# Strip is defined in the dsp-engine crate and is not #[repr(C)], so
# cbindgen can't (and must not) emit its layout — C may only ever hold
# pointers to it. cbindgen doesn't see the type at all from this crate,
# so the opaque forward declaration is supplied by hand here; without it
# the generated header references an undeclared type and won't compile.
after_includes = "\ntypedef struct Strip Strip;"
